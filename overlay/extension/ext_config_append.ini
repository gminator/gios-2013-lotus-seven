; Giovann: wooden dashboard and wooden rear parcel tray like the real Birkin
[SHADER_REPLACEMENT_DASH_WOOD]
MESHES = dashboard_lp_SUB0, dashboard001_SUB0, boot_cover
RESOURCE_0 = txDiffuse
RESOURCE_TEXTURE_0 = dash_wood.dds
RESOURCE_1 = txNormal
RESOURCE_TEXTURE_1 = flat_nrm.dds
PROP_0 = ksDiffuse, 0.5
PROP_1 = ksSpecular, 0.35
PROP_2 = ksSpecularEXP, 40

; polished aluminium windscreen frame
[SHADER_REPLACEMENT_SCREEN_FRAME]
MESHES = parbrise_chassis_SUB0
RESOURCE_0 = txDiffuse
RESOURCE_TEXTURE_0 = alu_polished.dds
PROP_0 = ksAmbient, 0.55
PROP_1 = ksDiffuse, 0.6
PROP_2 = ksSpecular, 1.6
PROP_3 = ksSpecularEXP, 60

; black headlight housings instead of chrome
[SHADER_REPLACEMENT_HEADLIGHTS]
MESHES = mainlight, mainlight01
SHADER = ksPerPixel
RESOURCE_0 = txDiffuse
RESOURCE_TEXTURE_0 = black_matte.dds
PROP_0 = ksAmbient, 0.4
PROP_1 = ksDiffuse, 0.5
PROP_2 = ksSpecular, 0.4
PROP_3 = ksSpecularEXP, 30
